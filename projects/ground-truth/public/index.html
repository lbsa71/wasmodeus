<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wasmodeus Ground Truth</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="world" aria-label="Procedural cave world of Newtonian sand pixels"></canvas>

    <p id="status">Starting up…</p>

    <aside id="debug" aria-label="Simulation counters">
      <strong>GROUND TRUTH</strong>
      <dl id="debug-rows"></dl>
    </aside>

    <form id="controls" aria-label="Simulation controls">
      <label for="capacity">
        Pixels in motion <output id="capacity-value" for="capacity">—</output>
        <input id="capacity" type="range" aria-label="Logarithmic pool size">
      </label>
      <label for="rest">
        Rest frames <output id="rest-value" for="rest">1</output>
        <input id="rest" type="range" step="1" aria-label="Frames a pixel may sit still before it settles">
      </label>
      <label for="slump">
        Flow <output id="slump-value" for="slump">0.60</output>
        <input id="slump" type="range" min="0" max="1" step="0.01" aria-label="How eagerly released material slumps sideways">
      </label>
      <label for="bounce">
        Elasticity <output id="bounce-value" for="bounce">0.18</output>
        <input id="bounce" type="range" min="0" max="1" step="0.01" aria-label="Coefficient of restitution for every impact">
      </label>
      <label for="blast">
        Brush radius <output id="blast-value" for="blast">90 px</output>
        <input id="blast" type="range" min="10" max="300" step="5" aria-label="Pointer brush radius in world pixels">
      </label>
      <div class="row">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <button id="reset" type="button">Reset</button>
        <button id="reseed" type="button">New world</button>
      </div>
    </form>

    <p id="hint">Drag to pan · wheel to zoom · shift-drag to smudge · alt-drag to blast</p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
