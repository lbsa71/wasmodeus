<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wasmodeus Galaxy Engine</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #00020a; }
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #status, #debug { position: fixed; z-index: 1; color: #d9e9ff; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
      #status { left: 1rem; top: 1rem; }
      #debug { right: 1rem; top: 1rem; min-width: 15rem; padding: .75rem; border: 1px solid #24446b; border-radius: .4rem; background: #030914cc; }
      #debug strong { color: #8ebaff; }
    </style>
  </head>
  <body>
    <p id="status">Preparing deterministic galaxy…</p>
    <aside id="debug" aria-label="Galaxy debugging information">
      <strong>GALAXY DEBUG</strong><br>
      x <span id="debug-x">0</span> pc<br>
      y <span id="debug-y">0</span> pc<br>
      zoom <span id="debug-zoom">0</span> pc<br>
      layer <span id="debug-layer">GALAXY OVERVIEW</span><br>
      galaxy <span id="debug-galaxy">—</span><br>
      focus <span id="debug-focus">—</span><br>
      body <span id="debug-body">—</span><br>
      time <span id="debug-time">1 s/s</span><br>
      fps <span id="debug-fps">0</span>
    </aside>
    <label id="time-control" for="time-scale">Time scale <output id="time-scale-value">1 s/s</output><input id="time-scale" type="range" min="0" max="1000" step="1" aria-label="Logarithmic time scale"></label>
    <p id="hint">Drag to pan · wheel to zoom · double-click a star to enter its system</p>
    <style>#hint { position:fixed; z-index:1; left:50%; bottom:1rem; transform:translateX(-50%); color:#a7bddc; font:13px/1.4 system-ui,sans-serif; white-space:nowrap; }</style>
    <style>#time-control { position:fixed; z-index:1; left:1rem; bottom:1rem; width:min(24rem, calc(100vw - 2rem)); color:#d9e9ff; font:13px/1.4 ui-monospace,monospace; } #time-scale { display:block; width:100%; accent-color:#8ebaff; } #time-scale-value { float:right; color:#8ebaff; }</style>
    <canvas id="galaxy" aria-label="Milky Way simulation"></canvas>
    <script type="module" src="./app.js"></script>
  </body>
</html>
